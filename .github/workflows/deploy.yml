name: Test, build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1. Install dependencies
      - run: npm ci

      # 2. Run the tests (type-check + unit tests: scoring, SRS, mastery, writing checker, backup, content integrity)
      - run: npm run typecheck
      - run: npm test

      # 3–4. Build the app and generate the PWA assets (manifest, service worker, precache list).
      # BASE_PATH = "/<repo>/" for a project site, "/" for a <user>.github.io repo or a custom domain.
      - name: Compute base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -n "${{ vars.BASE_PATH }}" ]]; then echo "path=${{ vars.BASE_PATH }}" >> "$GITHUB_OUTPUT";
          elif [[ "$REPO" == *.github.io ]]; then echo "path=/" >> "$GITHUB_OUTPUT";
          else echo "path=/$REPO/" >> "$GITHUB_OUTPUT"; fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Check PWA output
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest && echo "PWA assets OK"

      # GitHub Pages: a 404 page that falls back to the app shell.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    # Offline tests in a real browser (service worker, sub-path, IndexedDB persistence).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # 5. Deploy the production folder to GitHub Pages (only from main, only if every test passed).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
